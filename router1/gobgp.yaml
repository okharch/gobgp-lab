global:
  config:
    as: 65001
    router-id: "172.20.0.254"
  apply-policy:
    config:
      import-policy-list: ["policy1"]
      export-policy-list: ["policy1"]

neighbors:
  - config:
      neighbor-address: "172.20.1.254"
      peer-as: 65002
  - config:
      neighbor-address: "172.20.2.254"
      peer-as: 65003

defined-sets:
  prefix-sets:
    - prefix-set-name: "local-net"
      prefix-list:
        - ip-prefix: "192.168.88.0/24"
          masklength-range: "24..24"

policy-definitions:
  - name: "policy1"
    statements:
      - actions:
          route-disposition: "accept"
