global:
  config:
    as: 65003
    router-id: "172.28.0.3"
  apply-policy:
    config:
      import-policy-list:
        - "policy1"
      export-policy-list:
        - "policy1"

neighbors:
  - config:
      neighbor-address: "172.28.0.11"
      peer-as: 65001
  - config:
      neighbor-address: "172.28.0.2"
      peer-as: 65002

defined-sets:
  prefix-sets:
    - prefix-set-name: "local-net"
      prefix-list:
        - ip-prefix: "192.168.3.0/24"
          masklength-range: "24..24"

policy-definitions:
  - name: "policy1"
    statements:
      - actions:
          route-disposition: "accept"